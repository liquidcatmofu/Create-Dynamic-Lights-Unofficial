name: Build Jar

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - 1.20.1
  pull_request:
    branches:
      - main
      - 1.20.1

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: temurin

      - name: Make Gradle Wrapper Executable
        run: chmod +x ./gradlew

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}

      - name: Build
        run: ./gradlew build

      - name: Upload Forge artifact
        uses: actions/upload-artifact@v4
        with:
          name: forge-jars
          path: |
            forge/build/libs/*.jar
            !forge/build/libs/*-dev.jar
            !forge/build/libs/*-dev-shadow.jar
            !forge/build/libs/*-sources.jar
            !forge/build/libs/*-javadoc.jar
            !forge/build/libs/*-shadow.jar
          if-no-files-found: error

      - name: Upload Fabric artifact
        uses: actions/upload-artifact@v4
        with:
          name: fabric-jars
          path: |
            fabric/build/libs/*.jar
            !fabric/build/libs/*-dev.jar
            !fabric/build/libs/*-dev-shadow.jar
            !fabric/build/libs/*-sources.jar
            !fabric/build/libs/*-javadoc.jar
            !fabric/build/libs/*-shadow.jar
          if-no-files-found: error
