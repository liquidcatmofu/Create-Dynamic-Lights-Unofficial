plugins {
    id 'com.github.johnrengelman.shadow'
}

def dynamicLightsBackend = providers.gradleProperty('dynamicLightsBackend').getOrElse('sodium')
if (!['sodium', 'ryoamic'].contains(dynamicLightsBackend)) {
    throw new GradleException("dynamicLightsBackend must be 'sodium' or 'ryoamic'")
}

loom {
    forge {}

    runs {
        client {
            property 'mixin.env.remapRefMap', 'true'
            property 'mixin.env.refMapRemappingFile', "${projectDir}/build/createSrgToMcp/output.srg"
        }
    }
}

architectury {
    platformSetupLoomIde()
    forge()
}

configurations {
    common {
        canBeResolved = true
        canBeConsumed = false
    }
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentForge.extendsFrom common

    // Files in this configuration will be bundled into your mod using the Shadow plugin.
    // Don't use the `shadow` configuration from the plugin itself as it's meant for excluding files.
    shadowBundle {
        canBeResolved = true
        canBeConsumed = false
    }
}

dependencies {
    forge "net.minecraftforge:forge:$rootProject.forge_version"

    common(project(path: ':common', configuration: 'namedElements')) { transitive false }
    shadowBundle project(path: ':common', configuration: 'transformProductionForge')
    modImplementation ("com.simibubi.create:create-${minecraft_version}:${create_forge_version}:slim") { transitive = false }
    modImplementation("net.createmod.ponder:Ponder-Forge-${minecraft_version}:${ponder_forge_version}")
    modCompileOnly("dev.engine-room.flywheel:flywheel-forge-api-${minecraft_version}:${flywheel_forge_version}")
    modRuntimeOnly("dev.engine-room.flywheel:flywheel-forge-${minecraft_version}:${flywheel_forge_version}")
    modImplementation ("com.tterrag.registrate:Registrate:${registrate_version}")
    compileOnly(annotationProcessor("io.github.llamalad7:mixinextras-common:0.4.1"))
    implementation("io.github.llamalad7:mixinextras-forge:0.4.1")
    modCompileOnly ("maven.modrinth:sodium-dynamic-lights:${dynamiclights_forge_version}")
    modCompileOnly ("maven.modrinth:reCfnRvJ:${ryoamiclights_forge_version}")
    modCompileOnly ("maven.modrinth:obsidianui:${obsidianui_version}-forge")
    if (dynamicLightsBackend == 'ryoamic') {
        modLocalRuntime ("maven.modrinth:reCfnRvJ:${ryoamiclights_forge_version}")
        modLocalRuntime ("maven.modrinth:obsidianui:${obsidianui_version}-forge")
        modLocalRuntime ("dev.architectury:architectury-forge:${architectury_api_version}")
    } else {
        modLocalRuntime ("maven.modrinth:sodium-dynamic-lights:${dynamiclights_forge_version}")
    }
    forgeRuntimeLibrary ('org.anarres:jcpp:1.4.14')
    modLocalRuntime ("maven.modrinth:embeddium:${embeddium_version}+mc${minecraft_version}")
    modLocalRuntime ("maven.modrinth:oculus:${oculus_version}")
    modLocalRuntime ("com.simibubi.create:create-${minecraft_version}:${create_forge_version}:slim") { transitive = false }
}

processResources {
    inputs.property 'version', mod_version

    filesMatching('META-INF/mods.toml') {
        expand version: mod_version
    }
}

shadowJar {
    configurations = [project.configurations.shadowBundle]
    archiveClassifier = 'dev-shadow'
}

remapJar {
    input.set shadowJar.archiveFile
}
