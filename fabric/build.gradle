plugins {
    id 'com.github.johnrengelman.shadow'
}

def dynamicLightsBackend = providers.gradleProperty('dynamicLightsBackend').getOrElse('sodium')
if (!['sodium', 'ryoamic'].contains(dynamicLightsBackend)) {
    throw new GradleException("dynamicLightsBackend must be 'sodium' or 'ryoamic'")
}

architectury {
    platformSetupLoomIde()
    fabric()
}

configurations {
    common {
        canBeResolved = true
        canBeConsumed = false
    }
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentFabric.extendsFrom common

    // Files in this configuration will be bundled into your mod using the Shadow plugin.
    // Don't use the `shadow` configuration from the plugin itself as it's meant for excluding files.
    shadowBundle {
        canBeResolved = true
        canBeConsumed = false
    }
}

dependencies {
    modImplementation "net.fabricmc:fabric-loader:$rootProject.fabric_loader_version"

    // Fabric API. This is technically optional, but you probably want it anyway.
    modImplementation "net.fabricmc.fabric-api:fabric-api:$rootProject.fabric_api_version"

    common(project(path: ':common', configuration: 'namedElements')) { transitive false }
    shadowBundle project(path: ':common', configuration: 'transformProductionFabric')

    modImplementation ("com.simibubi.create:create-fabric:${create_fabric_version}")
    modCompileOnly ("maven.modrinth:sodium-dynamic-lights:${dynamiclights_fabric_version}")
    modCompileOnly ("maven.modrinth:reCfnRvJ:${ryoamiclights_fabric_version}")
    modCompileOnly ("maven.modrinth:obsidianui:${obsidianui_version}-fabric")
    if (dynamicLightsBackend == 'ryoamic') {
        modLocalRuntime ("maven.modrinth:reCfnRvJ:${ryoamiclights_fabric_version}")
        modLocalRuntime ("maven.modrinth:obsidianui:${obsidianui_version}-fabric")
        modLocalRuntime ("dev.architectury:architectury-fabric:${architectury_api_version}")
    } else {
        modLocalRuntime ("maven.modrinth:sodium-dynamic-lights:${dynamiclights_fabric_version}")
    }
    modImplementation ("com.terraformersmc:modmenu:${modmenu_version}")
    modImplementation ("fuzs.forgeconfigapiport:forgeconfigapiport-fabric:${forgeconfigapiport_fabric_version}")

    localRuntime ('org.anarres:jcpp:1.4.14')
    localRuntime ('io.github.douira:glsl-transformer:2.0.0-pre14')
    modLocalRuntime ("maven.modrinth:sodium:mc${minecraft_version}-${sodium_version}-fabric")
    modLocalRuntime ("maven.modrinth:indium:${indium_version}+mc${minecraft_version}")
    modLocalRuntime ("maven.modrinth:iris:${iris_version}+${minecraft_version}")
    // Flywheel and Iris compat
    modLocalRuntime ("maven.modrinth:colorwheel:1.2.3+mc1.20.1")
}

processResources {
    inputs.property 'version', mod_version

    filesMatching('fabric.mod.json') {
        expand version: mod_version
    }
}

shadowJar {
    configurations = [project.configurations.shadowBundle]
    archiveClassifier = 'dev-shadow'
}

remapJar {
    input.set shadowJar.archiveFile
}

configurations.all {
    // Sodium requires LWJGL 3.3.1
    resolutionStrategy {
        force 'org.lwjgl:lwjgl:3.3.1'
        force 'org.lwjgl:lwjgl-jemalloc:3.3.1'
        force 'org.lwjgl:lwjgl-openal:3.3.1'
        force 'org.lwjgl:lwjgl-opengl:3.3.1'
        force 'org.lwjgl:lwjgl-glfw:3.3.1'
        force 'org.lwjgl:lwjgl-stb:3.3.1'
        force 'org.lwjgl:lwjgl-tinyfd:3.3.1'
    }
}
